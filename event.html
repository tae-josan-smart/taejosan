<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>행사정보 | 태조산공원 스마트 안내</title>

<link rel="stylesheet" href="style.css">

<style>

/* 행사정보 전용 */

.event-header{
    background:linear-gradient(135deg,#2e7d32,#43a047);
    color:white;
    text-align:center;
    padding:35px 20px;
}

.event-header h1{
    font-size:30px;
    margin-bottom:8px;
}

.event-header p{
    margin:0;
    opacity:.9;
}

.event-card{
    background:white;
    border-radius:24px;
    overflow:hidden;
    margin-bottom:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.event-card img{
    width:100%;
    height:auto;
    display:block;
}

.event-content{
    padding:22px;
}

.event-content h2{
    color:#2e7d32;
    margin-bottom:10px;
}

.event-content p{
    color:#666;
    margin:0;
}

.event-date{
    display:inline-block;
    margin-top:12px;
    padding:7px 12px;
    border-radius:20px;
    background:#edf5ef;
    color:#2e7d32;
    font-weight:bold;
    font-size:14px;
}

.event-note{
    background:#f5f8f4;
    border-radius:15px;
    padding:15px;
    margin-top:12px;
    font-size:14px;
    color:#555;
}

.back-button{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#2e7d32;
    color:white;
    padding:16px;
    border-radius:15px;
    font-weight:bold;
    margin-top:10px;
}

.back-button:hover{
    background:#43a047;
}

</style>

</head>


<body>


<header class="park-header">

    <div class="header-inner">

        <a href="index.html" class="back-btn">
            ←
        </a>

        <div class="header-title">

            <h1>
                📢 행사정보
            </h1>

            <p>
                태조산공원 및 주변에서 진행되는 행사와 운영정보입니다.
            </p>

        </div>

    </div>

</header>


<div class="container">


<!-- 도솔공원 야외물놀이장 -->

<div class="event-card">

<img
src="images/waterpark.jpg"
alt="천안 도솔공원 야외물놀이장">

<div class="event-content">

<h2>💦 도솔공원 야외물놀이장</h2>

<span class="event-date">
2026. 7. 18. ~ 8. 16.
</span>

<p class="event-note">
천안 도솔공원에서 운영되는 야외 물놀이장입니다.
자세한 운영시간 및 이용방법은 행사 안내 이미지를 확인해주세요.
</p>

</div>

</div>


<!-- 태조산 야간개장 -->

<div class="event-card">

<img
src="images/night-opening.jpg"
alt="태조산 야간개장">

<div class="event-content">

<h2>🌙 태조산 야간개장</h2>

<span class="event-date">
2026. 6. 17. ~ 8. 28.
</span>

<p class="event-note">
낮보다 더 짜릿한 태조산 야간 체험!
짚코스터, 공중네트, 숲모험 등 다양한 시설을 야간에 이용할 수 있습니다.
</p>

</div>

</div>


<!-- 메인으로 -->

<a href="index.html" class="back-button">

🏠 메인으로 돌아가기

</a>


</div>


<footer>

© Cheonan Urban Corporation

</footer>


</body>

</html>
